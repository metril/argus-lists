name: generate

on:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      allow_size_change:
        description: "Override the size guard (a category shrank >20% or grew >5x)"
        type: boolean
        default: false

permissions:
  contents: write        # push the generate/auto branch (never main)
  pull-requests: write

concurrency: generate

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the generator
        run: python generator/generate.py ${{ inputs.allow_size_change && '--allow-size-change' || '' }}
      - name: Validate and build
        run: |
          python scripts/validate.py
          python scripts/build.py check
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain lists generated)" ]; then
            echo "No changes."; exit 0
          fi
          python generator/pr_body.py > "$RUNNER_TEMP/body.md"
          printf '\n\n(Generated by the generate workflow.)\n' >> "$RUNNER_TEMP/body.md"
          git config user.name "metril"
          git config user.email "1517921+metril@users.noreply.github.com"
          git checkout -B generate/auto
          git add lists generated
          git commit -m "Refresh generated bypass lists"
          git push --force origin generate/auto
          if gh pr view generate/auto --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit generate/auto --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head generate/auto \
              --title "Refresh generated bypass lists" --body-file "$RUNNER_TEMP/body.md"
          fi
