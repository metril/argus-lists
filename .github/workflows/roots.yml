name: roots

on:
  schedule:
    - cron: "43 4 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write        # push to main (auto changes) or the roots/auto branch (additions)
  pull-requests: write
  actions: write         # dispatch release.yml after an auto-commit

concurrency: roots

jobs:
  roots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Regenerate (fails loudly if CCADB and certdata disagree)
        run: |
          cp roots/roots.json "$RUNNER_TEMP/old.json"
          python generator/rootstore.py generate
          python scripts/validate_roots.py
      - name: Apply the approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(python generator/rootstore.py classify "$RUNNER_TEMP/old.json" roots/roots.json --body "$RUNNER_TEMP/body.md")
          echo "status: $status"
          [ "$status" = none ] && { git checkout roots/roots.json; exit 0; }
          git config user.name "metril"
          git config user.email "1517921+metril@users.noreply.github.com"
          if [ "$status" = auto ]; then
            # removals and new/earlier distrust dates only: straight to main
            git add roots/roots.json
            git commit -m "Update Mozilla root store (removals and distrust dates)"
            git push origin HEAD:main
            # pushes made with GITHUB_TOKEN do not trigger workflows, so dispatch the release
            gh workflow run release.yml --ref main
            exit 0
          fi
          # additions or a loosened distrust date: one rolling PR, never auto-merged
          printf '\n(Generated by the roots workflow. Review each root before merging.)\n' >> "$RUNNER_TEMP/body.md"
          git checkout -B roots/auto
          git add roots/roots.json
          git commit -m "Update Mozilla root store (additions)"
          git push --force origin roots/auto
          if gh pr view roots/auto --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit roots/auto --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head roots/auto \
              --title "Update Mozilla root store (additions)" --body-file "$RUNNER_TEMP/body.md"
          fi
