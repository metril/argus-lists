name: catalog-check

on:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check every catalog URL
        id: net
        run: |
          set +e
          python scripts/validate.py --net | tee "$RUNNER_TEMP/net.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update the issue on failures
        if: steps.net.outputs.rc != '0'
        run: |
          title="Catalog check failing"
          {
            echo "The weekly \`validate.py --net\` run found problems ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID):"
            echo
            grep '^::error::' "$RUNNER_TEMP/net.log" | sed 's/^::error::/- /'
          } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
              -q "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Fail the job
        if: steps.net.outputs.rc != '0'
        run: exit 1
