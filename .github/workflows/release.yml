name: release

on:
  push:
    branches: [main]
    paths: ["lists/**", "roots/**", "meta.json", "scripts/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lists
        run: python scripts/validate.py
      - name: Validate the root store
        run: |
          pip install -q cryptography
          curl -fsSL -o "$RUNNER_TEMP/prev-roots.json" \
            "https://github.com/${{ github.repository }}/releases/latest/download/roots.json" || rm -f "$RUNNER_TEMP/prev-roots.json"
          python scripts/validate_roots.py --previous "$RUNNER_TEMP/prev-roots.json"

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require the signing key
        env:
          ARGUS_LISTS_SIGNING_KEY: ${{ secrets.ARGUS_LISTS_SIGNING_KEY }}
        run: |
          if [ -z "$ARGUS_LISTS_SIGNING_KEY" ]; then
            echo "::error::ARGUS_LISTS_SIGNING_KEY is not set. Nothing is published unsigned."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick the version (vYYYY.MM.DD, then .N for further releases that day)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          n=0
          version="$base"
          while gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            n=$((n + 1))
            version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the bundle
        run: python scripts/build.py "${{ steps.ver.outputs.version }}"
      - name: Sign every file (Ed25519, minisign format)
        env:
          ARGUS_LISTS_SIGNING_KEY: ${{ secrets.ARGUS_LISTS_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$ARGUS_LISTS_SIGNING_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -x "$f.minisig" \
              -t "argus-lists ${{ steps.ver.outputs.version }} $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "${{ steps.ver.outputs.version }}" \
            --notes "Curated bypass lists for Argus. Each file has a .minisig signature."
