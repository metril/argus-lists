name: release

on:
  push:
    branches: [main]
    paths: ["lists/**", "roots/**", "meta.json", "scripts/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # the range since the last release is walked for an approving merged PR
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate lists
        run: python scripts/validate.py
      - name: Validate the root store
        run: |
          pip install -q --require-hashes -r requirements.txt
          # only a 404 means "no previous release"; any other failure stops the release
          code=$(curl -sSL -o "$RUNNER_TEMP/prev-roots.json" -w '%{http_code}' \
            "https://github.com/${{ github.repository }}/releases/latest/download/roots.json") || code=000
          case "$code" in
            200) prev="--previous $RUNNER_TEMP/prev-roots.json" ;;
            404) prev="" ;;
            *) echo "::error::fetching the published roots.json failed (HTTP $code)"; exit 1 ;;
          esac
          # the release tag points at the commit that was published (see "Publish release assets")
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          commit=""
          if [ -n "$tag" ]; then commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true); fi
          python scripts/validate_roots.py $prev --require-approval ${commit:+--prev-commit "$commit"}

  release:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require the signing key
        env:
          ARGUS_LISTS_SIGNING_KEY: ${{ secrets.ARGUS_LISTS_SIGNING_KEY }}
        run: |
          if [ -z "$ARGUS_LISTS_SIGNING_KEY" ]; then
            echo "::error::ARGUS_LISTS_SIGNING_KEY is not set. Nothing is published unsigned."
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pick the version (vYYYY.MM.DD, then .N for further releases that day)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          n=0
          version="$base"
          while gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            n=$((n + 1))
            version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the bundle
        run: python scripts/build.py "${{ steps.ver.outputs.version }}"
      - name: Sign every file (Ed25519, minisign format)
        env:
          ARGUS_LISTS_SIGNING_KEY: ${{ secrets.ARGUS_LISTS_SIGNING_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$ARGUS_LISTS_SIGNING_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -x "$f.minisig" \
              -t "argus-lists ${{ steps.ver.outputs.version }} $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.version }}" \
            --notes "Curated bypass lists for Argus. Each file has a .minisig signature."
